<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<link rel="stylesheet" href="leaflet.css"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f2f2f2; }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

  /* 我的位置：蓝点 + 按航向旋转的箭头 */
  .me-dot {
    width: 18px; height: 18px; background: #1a73ff;
    border: 3px solid #fff; border-radius: 50%;
    box-shadow: 0 0 6px rgba(0,0,0,.45);
  }
  .me-arrow {
    width: 0; height: 0; margin: 1px auto 0;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-bottom: 10px solid #fff;
  }
  .dest-pin {
    width: 22px; height: 22px; background: #FF7A1A;
    border: 2px solid #fff; border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: 0 0 6px rgba(0,0,0,.45);
  }

  /* 顶部导航信息条：距离 / 用时 / 预计到达时刻 */
  #info {
    position: absolute; z-index: 1000; top: 8px; left: 8px; right: 8px;
    background: rgba(22,24,29,.86); color: #fff;
    border-radius: 14px; padding: 8px 12px; font-size: 12px; line-height: 1.45;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    pointer-events: none; display: none;
  }
  #info b { color: #FFB27A; }
</style>
</head>
<body>
<div id="map"></div>
<div id="info"></div>
<script src="leaflet.js"></script>
<script>
  /* 坐标：App 推过来的是 GCJ-02（已纠偏），高德栅格瓦片也是 GCJ-02，天然对齐 */
  var map = L.map('map', { zoomControl: false, attributionControl: true })
             .setView([30.59, 114.31], 11);

  function amapTiles(style) {
    return L.tileLayer(
      'https://webst0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=' + style + '&x={x}&y={y}&z={z}',
      { subdomains: ['1','2','3','4'], maxNativeZoom: 18, maxZoom: 19, minZoom: 3, attribution: '© 高德地图' }
    );
  }

  var normalLayer = amapTiles(7);      // 标准矢量路网
  var satLayer    = amapTiles(6);      // 卫星影像
  var roadLayer   = amapTiles(8);      // 路网叠加（配合卫星图看地名道路）
  var curLayer = 'normal';
  var tileErrReported = false;

  function watchErr(layer) {
    layer.on('tileerror', function (e) {
      if (tileErrReported) return;
      tileErrReported = true;
      try { Android.log('底图瓦片加载失败：' + (e && e.error ? e.error : '网络被拦')); } catch (x) {}
    });
  }
  watchErr(normalLayer); watchErr(satLayer); watchErr(roadLayer);

  normalLayer.addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  /* 图层切换：normal / satellite */
  function setLayer(mode) {
    map.removeLayer(normalLayer);
    map.removeLayer(satLayer);
    map.removeLayer(roadLayer);
    if (mode === 'satellite') { satLayer.addTo(map); roadLayer.addTo(map); }
    else { normalLayer.addTo(map); }
    curLayer = mode;
  }
  function toggleLayer() {
    setLayer(curLayer === 'normal' ? 'satellite' : 'normal');
    return curLayer;
  }

  var meMarker = null, destMarker = null, routeLine = null, routeCasing = null, firstFix = true;

  function meIcon(bearing) {
    var html = '<div class="me-dot"><div class="me-arrow" style="transform:rotate(' +
               (bearing || 0) + 'deg);transform-origin:50% 100%"></div></div>';
    return L.divIcon({ className: '', html: html, iconSize: [18, 18], iconAnchor: [9, 9] });
  }

  function onMyLocation(lat, lng, bearing, speed) {
    var p = [lat, lng];
    if (!meMarker) {
      meMarker = L.marker(p, { icon: meIcon(bearing) }).addTo(map);
    } else {
      meMarker.setLatLng(p);
      meMarker.setIcon(meIcon(bearing));
    }
    if (firstFix) { map.setView(p, 17); firstFix = false; }   // 首次定位直接给到街道级
  }

  function onDestination(lat, lng, name) {
    var p = [lat, lng];
    if (destMarker) map.removeLayer(destMarker);
    destMarker = L.marker(p, {
      icon: L.divIcon({ className: '', html: '<div class="dest-pin"></div>', iconSize: [22, 22], iconAnchor: [11, 21] })
    }).addTo(map);
    if (name) destMarker.bindTooltip(name, { direction: 'top', offset: [0, -20] });
    if (meMarker) map.fitBounds([meMarker.getLatLng(), p], { padding: [40, 40] });
    else map.setView(p, 16);
  }

  /* 路线 + 导航信息：json=[[lat,lng]...]，meters 全程米，seconds 全程秒 */
  function onRoute(json, meters, seconds, name) {
    try {
      if (routeLine) map.removeLayer(routeLine);
      if (routeCasing) map.removeLayer(routeCasing);
      routeLine = null; routeCasing = null;
      var pts = JSON.parse(json);
      if (pts && pts.length >= 2) {
        /* 先画白色描边再画蓝线，路线在底图上更清晰（主流地图 App 的做法） */
        routeCasing = L.polyline(pts, { color: '#ffffff', weight: 11, opacity: 0.9 }).addTo(map);
        routeLine = L.polyline(pts, { color: '#1a73ff', weight: 6, opacity: 0.95 }).addTo(map);
        map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
        /* 终点补一个图钉（有些联想词选出来没单独打过） */
        var end = pts[pts.length - 1];
        if (!destMarker) onDestination(end[0], end[1], name || '目的地');
      }
      showInfo(meters, seconds, name);
    } catch (e) {}
  }

  function showInfo(meters, seconds, name) {
    var box = document.getElementById('info');
    if (!meters || meters <= 0) { box.style.display = 'none'; return; }
    var km = meters / 1000.0;
    var min = Math.max(1, Math.round((seconds || 0) / 60.0));
    var arrive = new Date(Date.now() + (seconds || 0) * 1000);
    var hh = ('0' + arrive.getHours()).slice(-2);
    var mm = ('0' + arrive.getMinutes()).slice(-2);
    box.innerHTML = (name ? '→ <b>' + name + '</b><br/>' : '') +
      '全程 <b>' + km.toFixed(1) + ' km</b> · ' +
      '约 <b>' + min + ' 分钟</b> · ' +
      '预计 <b>' + hh + ':' + mm + '</b> 到达';
    box.style.display = 'block';
  }

  function onClearRoute() {
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (routeCasing) { map.removeLayer(routeCasing); routeCasing = null; }
    if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
    document.getElementById('info').style.display = 'none';
  }

  function recenterMe() {
    if (meMarker) map.setView(meMarker.getLatLng(), 17);
    else { try { Android.log('还没有定位，等几秒或检查定位权限'); } catch (x) {} }
  }
</script>
</body>
</html>
