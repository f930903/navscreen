name: Android APK

# 自动编译 lite 变体 APK（零第三方依赖，推上来就能出包）
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read
  issues: write

jobs:
  build-lite:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接写入许可文件，比 sdkmanager --licenses 和第三方 action 都稳
      - name: 接受 Android SDK 许可
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b7025c\n'                    > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf '\nd975f751698a77b662f1254ddbeed3901e976f5a\n' > "$ANDROID_HOME/licenses/intel-android-extra-license"
          ls -la "$ANDROID_HOME/licenses"

      - name: 用 sdkmanager 补装组件并接受许可
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMAN=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: ${SDKMAN:-未找到}"
          if [ -n "$SDKMAN" ]; then
            yes 2>/dev/null | "$SDKMAN" --licenses > /dev/null 2>&1 || true
            "$SDKMAN" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
            "$SDKMAN" --install "build-tools;33.0.1" > /dev/null 2>&1 || true
          fi
          echo "--- 已装 build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "无"
          echo "--- 已装 platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "无"

      - name: 安装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # 失败不中断整个 job，先把日志留下来
      - name: 编译 liteDebug
        id: build
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleLiteDebug --no-daemon --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      # 编译失败时把日志尾部发成一个 Issue，方便远程排查（仓库公开时日志也是公开的）
      - name: 失败时上报日志
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('android/build.log', 'utf8'); }
            catch (e) { log = '（没读到 build.log：' + e.message + '）'; }
            const tail = log.split('\n').slice(-250).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 APK 自动编译失败 · run #' + context.runNumber,
              body: '自动上报，仅用于排查。\n\n```\n' + tail + '\n```'
            });

      - name: 判定构建失败
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: navscreen-lite-apk
          path: android/app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
