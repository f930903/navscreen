name: Android APK

# 自动编译 lite 变体 APK（零第三方依赖，推上来就能出包）
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-lite:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK（自动接受许可）
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 编译 liteDebug
        working-directory: android
        run: gradle assembleLiteDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: navscreen-lite-apk
          path: android/app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
