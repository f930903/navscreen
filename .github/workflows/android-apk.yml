name: Android APK

# 自动编译 lite 变体 APK（零第三方依赖，推上来就能出包）
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read
  issues: write

jobs:
  build-lite:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK（自动接受许可）
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # 失败不中断整个 job，先把日志留下来
      - name: 编译 liteDebug
        id: build
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleLiteDebug --no-daemon --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      # 编译失败时把日志尾部发成一个 Issue，方便远程排查（仓库公开时日志也是公开的）
      - name: 失败时上报日志
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('android/build.log', 'utf8'); }
            catch (e) { log = '（没读到 build.log：' + e.message + '）'; }
            const tail = log.split('\n').slice(-250).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 APK 自动编译失败 · run #' + context.runNumber,
              body: '自动上报，仅用于排查。\n\n```\n' + tail + '\n```'
            });

      - name: 判定构建失败
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: navscreen-lite-apk
          path: android/app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
