name: Build NavScreen Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: ESP-IDF 编译（esp32s3）
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: '.'
          command: idf.py build

      - name: 合并为单文件固件（方便网页刷机）
        run: |
          cd build
          python -m pip install --quiet esptool
          python -m esptool --chip esp32s3 merge_bin \
            -o merged-binary.bin \
            --flash_mode dio --flash_size 16MB \
            0x0      bootloader/bootloader.bin \
            0x8000   partition_table/partition-table.bin \
            0x10000  navscreen.bin
          ls -la merged-binary.bin

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: navscreen-firmware-bin
          path: |
            build/merged-binary.bin
            build/navscreen.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
